<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>axshare</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: .5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #8884;
      font-size: .875rem;
    }
    button {
      font: inherit;
      padding: .25rem .75rem;
      cursor: pointer;
    }
    #status { flex: 1; text-align: right; opacity: .7; }
    textarea {
      flex: 1;
      border: 0;
      outline: 0;
      resize: none;
      padding: 1rem;
      font: inherit;
      background: transparent;
      color: inherit;
    }
  </style>
</head>
<body>
  <header>
    <strong>axshare</strong>
    <button id="share">share</button>
    <span id="status">no paste loaded</span>
  </header>
  <textarea id="buf" placeholder="paste here…" spellcheck="false" autofocus></textarea>

  <script>
    const buf = document.getElementById('buf');
    const status = document.getElementById('status');

    async function share() {
      const res = await fetch('/api/pastes', { method: 'POST', body: buf.value });
      if (!res.ok) { status.textContent = `error ${res.status}`; return; }
      const { id } = await res.json();
      history.replaceState(null, '', `?id=${id}`);
      status.textContent = location.href;
    }

    async function load(id) {
      const res = await fetch(`/api/pastes/${id}`);
      if (!res.ok) { status.textContent = `not found: ${id}`; return; }
      buf.value = await res.text();
      status.textContent = location.href;
    }

    document.getElementById('share').addEventListener('click', share);

    const id = new URLSearchParams(location.search).get('id');
    if (id) load(id);
  </script>
</body>
</html>
