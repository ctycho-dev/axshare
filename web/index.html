<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axshare</title>
    <meta name="description" content="Live text sync between machines. Create a file, share the link, edit it from anywhere.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Axshare">
  <meta property="og:title" content="Axshare: live text sync between machines">
  <meta property="og:description" content="Create a file, share the link, edit it from anywhere. No account needed.">
  <meta property="og:url" content="https://axshare.dev/">
  <meta property="og:image" content="https://axshare.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    try {
      const t = localStorage.getItem('axshare.theme')
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
    } catch { }
  </script>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" href="/favicon.svg">
</head>

<body>
  <div class="corner">
    <span id="theme"></span>
    <span class="account" id="account"></span>
  </div>

  <main class="landing">
    <span class="wordmark">axshare</span>
    <p class="tagline">Live text sync. Create a file, share the link, edit it from anywhere. No account needed: files
      last 24 hours, or 7 days when you sign in.</p>

    <button class="create" id="create">create file <kbd>⏎</kbd></button>
    <p class="hint">or press n</p>

    <section class="recent" id="mine" hidden>
      <header>
        <span>my files</span>
        <button id="mine-toggle" hidden></button>
      </header>
      <div id="mine-rows"></div>
    </section>

    <section class="recent" id="recent" hidden>
      <header>
        <span>recent on this machine</span>
        <button id="clear">clear</button>
      </header>
      <div id="recent-rows"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="server-info">axshare</span>
    <nav>
      <a href="/privacy.html">privacy</a>
      <a href="https://github.com/ctycho-dev/axshare" target="_blank" rel="noopener">source</a>
    </nav>
  </footer>

  <script type="module" src="/src/index.ts"></script>
</body>
<div class="corner">
  <span id="theme"></span>
  <span class="account" id="account"></span>
</div>

</html>
